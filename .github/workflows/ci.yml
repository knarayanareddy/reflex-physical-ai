name: CI

# Runs what `make check` runs, on every push and pull request, plus the frontend job that D-T27
# listed as NOT_DONE #5. Two jobs, because the Python gate must stay fast and independent of npm:
#
#   check     — the Python gate (`make check`): lint, types, contracts, calibration, tests;
#   frontend  — typecheck, the dev build, the Pages build, and the committed replay bundle.
#
# The Pages workflow deploys on push to main; this one fails the pull request first. Without it a
# TypeScript error would only surface after merge, on a workflow whose failure pages nobody.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, contracts, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2  # pin: no moving v10 major tag exists
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies from the lockfile
        run: cd backend && uv sync --frozen --extra dev --python 3.12

      - name: Lint (ruff check)
        run: cd backend && uv run ruff check app tests ../scripts

      - name: Format check (ruff format)
        run: cd backend && uv run ruff format --check app tests ../scripts

      - name: Type check (mypy)
        run: cd backend && uv run mypy app

      - name: Contracts (schema, $refs, taxonomy conformance, ledger fixture)
        run: cd backend && uv run python ../scripts/validate_schema.py -v

      - name: Taxonomy structure and degraded-mode strictness
        # Placeholders are tolerated until rig calibration (D-T06) lands; the run prints
        # every unresolved value so the debt is visible in the log rather than hidden.
        run: cd backend && uv run python ../scripts/validate_taxonomy.py --allow-placeholders --allow-missing-fixtures

      - name: Calibration coverage, provenance and degraded strictness
        # Exit 2 means "structurally sound but still synthetic" and is reported, not failed:
        # the numbers cannot be measured before the rig exists (D-T06). `make params-strict`
        # is the gate to flip once it does.
        run: |
          cd backend
          set +e
          uv run python ../scripts/check_param_provenance.py
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice title=Calibration::Placeholder values recorded — decisions are forced to mode=simulation"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          uv run python ../scripts/diff_parameter_sets.py

      - name: Fixture corpus matches the implementation
        run: cd backend && uv run python ../scripts/make_fixtures.py --check

      - name: Tests
        run: cd backend && uv run pytest -q

      - name: Envelope purity, determinism and the fixture corpus
        # Belt and braces: the suite already covers this, but the claim is the headline of the
        # project, so it gets its own named step that can never be silently dropped.
        run: |
          cd backend
          uv run pytest tests/test_envelope_purity.py tests/test_envelope_determinism.py -q
          uv run python -m app.envelope verify

      - name: Replay both arms and validate the records
        run: |
          cd backend
          uv run python ../jobs/replay_all.py --from-fixtures --quiet --out ../runs/replay

      - name: Application imports and answers HTTP
        # The specific failure this guards: a syntax error in app/__init__.py kept the
        # package unimportable while the whole suite stayed green.
        run: |
          cd backend
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          assert client.get("/health").status_code == 200
          assert client.get("/v1/info").json()["build"]["taxonomy_rules"] == 10
          print("smoke: ok")
          PY

  frontend:
    name: frontend typecheck, builds and replay bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Typecheck (tsc --noEmit)
        run: cd frontend && npm run typecheck

      - name: Dev build (base '/', the build `make demo` serves)
        run: cd frontend && npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies from the lockfile
        run: cd backend && uv sync --frozen --python 3.12

      - name: Committed replay bundle still matches the envelope
        # Regenerates the bundle from the current code and fails if any of its seven invariants
        # break. It deliberately does not compare bytes with the committed file: `latency_us` is a
        # real measurement and changes run to run. The *claims* must hold, the microseconds need not.
        run: make pages-data

      - name: Static replay invariants on the committed bundle
        run: make pages-check

      - name: Pages build (base '/reflex-physical-ai/')
        run: cd frontend && npm run build -- --mode pages

      - name: The Pages tree carries the bundle under the project sub-path
        run: |
          set -euo pipefail
          test -f frontend/dist/replay/bundle.json
          grep -q '/reflex-physical-ai/assets/' frontend/dist/index.html
          echo "pages build: ok"
