[project]
name = "reflex-physical-ai"
version = "0.1.0"
description = "Reflex — Deterministic Edge Safety Envelope & Cloud Replay for Physical AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "duckdb>=0.10.0",
    "openai>=1.14.0",
    "jinja2>=3.1.3",
    "jsonschema>=4.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
